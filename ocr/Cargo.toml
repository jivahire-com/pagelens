[package]
name = "pagelens-ocr"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Optional companion to pagelens: reads scanned pages and text images locally with PP-OCRv6 and runs pagelens on the result"
publish = false

# A separate, optional tool: the parser stays as it is, and only those who
# need scans read install this. Pure Rust, like the parser; the OCR models
# (6.3 MB, Apache-2.0) are compiled in. Fetch them with ocr/fetch-models.sh.

[dependencies]
pagelens = { path = ".." }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe", "image_latest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
rten = { version = "=0.28.0", default-features = false, features = ["onnx_format"] }
rten-tensor = "=0.28.0"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
