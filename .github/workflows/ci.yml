# Build, test and package pagelens on Linux, macOS and Windows.
# Manual only (Actions tab, "Run workflow"): pushes, tags and pull requests
# start nothing, so no GitHub build minutes are used.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Models are downloaded and quantised once, so every platform embeds the
  # same bytes.
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            models/ocrs
            models/ner
          key: models-${{ hashFiles('scripts/fetch-assets.sh', 'scripts/quantize_ner.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install onnx==1.22.0 onnxruntime==1.19.2
          sh scripts/fetch-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            models/ocrs
            models/ner
          retention-days: 3

  build:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, test: true }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { platform: mac-arm64, os: macos-15, target: aarch64-apple-darwin, test: true }
          # Intel Macs: cross-built on Apple Silicon (no Intel runners).
          - { platform: mac-x64, os: macos-15, target: x86_64-apple-darwin, test: false }
          - { platform: win-x64, os: windows-2022, target: x86_64-pc-windows-msvc, test: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: PDFium for ${{ matrix.platform }}
        run: |
          PAGELENS_PLATFORM=${{ matrix.platform }} sh scripts/fetch-assets.sh --no-ner
          dir=vendor/pdfium-${{ matrix.platform }}
          case "${{ matrix.platform }}" in
            mac-*) lib=$dir/lib/libpdfium.dylib ;;
            win-*) lib=$dir/bin/pdfium.dll ;;
            *) lib=$dir/lib/libpdfium.so ;;
          esac
          echo "PAGELENS_PDFIUM_LIB=$PWD/$lib" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Smoke test the binary
        if: matrix.test
        run: |
          bin=target/${{ matrix.target }}/release/pagelens
          "$bin" --version
          "$bin" tests/fixtures/invoice_1.pdf > out.json
          python3 -c "import json; d=json.load(open('out.json')); assert len(d['tables'])==1, d['tables']; print('ok:', d['markdown'].splitlines()[0])" \
            || python -c "import json; d=json.load(open('out.json')); assert len(d['tables'])==1, d['tables']; print('ok:', d['markdown'].splitlines()[0])"
          "$bin" render tests/fixtures/invoice_1.pdf rendered.pdf
          "$bin" rendered.pdf > /dev/null
      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name=pagelens-$version-${{ matrix.platform }}
          mkdir -p dist/$name
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp target/${{ matrix.target }}/release/pagelens$ext dist/$name/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md dist/$name/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a -bso0 $name.zip $name; else tar -czf $name.tar.gz $name; fi
          rm -rf $name
      - uses: actions/upload-artifact@v4
        with:
          name: pagelens-${{ matrix.platform }}
          path: dist/*

  # The default build leaves OCR and the name model out; builds with them
  # (alone or together) still compile.
  features:
    needs: assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sh scripts/fetch-assets.sh --no-ner
      - run: |
          for f in "embed-pdfium" "ocr,embed-pdfium" "ner,embed-pdfium" "ocr,ner,embed-pdfium"; do
            echo "== $f"; cargo check --locked --no-default-features --features "$f" --all-targets
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, features]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pagelens-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "pagelens ${{ github.ref_name }}" --generate-notes
